<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d13" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Compare" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Compare — Stock Charts</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0a0d13; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #d1d4dc;
    padding: env(safe-area-inset-top,16px) 14px calc(env(safe-area-inset-bottom,16px) + 16px);
    max-width: 720px;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; padding-top:6px; }
  .titleRow { display:flex; align-items:baseline; gap:7px; }
  .logoDot { width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,#3d7cf4,#2fbf9f); }
  h1 { font-size:18px; font-weight:700; margin:0; letter-spacing:-0.02em; color:#eef0f4; }
  .subtitle { font-size:11px; color:#5b6270; font-weight:500; }
  .headerBtns { display:flex; gap:6px; }
  .iconBtn { background:#12161f; border:1px solid #1c212b; border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:#9198a8; font-size:14px; }
  .rangeGroup { display:flex; gap:2px; background:#12161f; border:1px solid #1c212b; border-radius:9px; padding:3px; margin-bottom:12px; }
  .rangeBtn { flex:1; background:transparent; border:none; color:#7b8291; font-size:12.5px; font-weight:600; padding:8px 0; border-radius:6px; font-family:'IBM Plex Mono', monospace; }
  .rangeBtn.active { background:#232a38; color:#eef0f4; }
  .keyPanel { background:#12161f; border:1px solid #1c212b; border-radius:10px; padding:12px; margin-bottom:14px; }
  .keyPanelRow { display:flex; gap:8px; }
  .keyInput { flex:1; background:#0d1017; border:1px solid #232a38; border-radius:7px; padding:10px; color:#eef0f4; font-size:13px; font-family:'IBM Plex Mono', monospace; min-width:0; }
  .keySaveBtn { background:#2d5df1; border:none; border-radius:7px; padding:10px 16px; color:#fff; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .keyNote { font-size:10.5px; color:#5b6270; margin-top:8px; line-height:1.4; }
  .keyLink { color:#7ea2f7; }
  .noKeyBanner { display:flex; align-items:center; gap:6px; background:#1a140f; border:1px solid #3a2c1a; color:#e0a95c; font-size:12px; border-radius:8px; padding:10px 12px; margin-bottom:14px; }

  /* ---- symbol grid: fits on one screen, no horizontal scroll ---- */
  .symbolGrid { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-bottom:10px; }
  .symbolCard {
    position:relative; background:#12161f; border-radius:10px; padding:10px 10px 9px 12px;
    border:1px solid #1c212b; border-left-width:4px; overflow:hidden; transition:opacity .15s;
  }
  .symbolCard.dimmed { opacity:0.38; }
  .symbolCardTop { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .symbolSym { font-size:14.5px; font-weight:700; font-family:'IBM Plex Mono', monospace; color:#f2f4f7; letter-spacing:0.2px; }
  .symbolRemove { color:#4a5262; font-size:13px; padding:2px 4px; line-height:1; }
  .symbolPrice { font-size:17px; font-weight:700; font-family:'IBM Plex Mono', monospace; color:#eef0f4; line-height:1.1; }
  .symbolChangeRow { display:flex; align-items:center; gap:6px; margin-top:3px; }
  .symbolChangeAbs { font-size:11px; font-family:'IBM Plex Mono', monospace; color:#7b8291; }
  .symbolChangePct { font-size:11.5px; font-weight:700; font-family:'IBM Plex Mono', monospace; padding:1px 6px; border-radius:5px; }
  .symbolErr { font-size:11px; color:#f25a5a; font-family:'IBM Plex Mono', monospace; }
  .symbolLoading { font-size:11px; color:#5b6270; font-family:'IBM Plex Mono', monospace; }

  .addRow { display:flex; align-items:center; gap:8px; background:#0d1017; border:1px dashed #262c38; border-radius:10px; padding:9px 10px; margin-bottom:14px; }
  .addInput { flex:1; background:transparent; border:none; color:#eef0f4; font-size:13px; font-family:'IBM Plex Mono', monospace; min-width:0; }
  .addBtn { background:#1a2029; border:none; border-radius:7px; padding:7px 14px; color:#9198a8; font-size:13px; font-weight:600; }

  .chartCard { background:#0d1017; border:1px solid #171b24; border-radius:12px; padding:14px 6px 6px; min-height:300px; position:relative; }
  .emptyState { color:#454b57; font-size:13px; text-align:center; padding:60px 20px; }
  .spin { animation: spin 1s linear infinite; display:inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footerRow { margin-top:10px; text-align:center; }
  .footerNote { font-size:10.5px; color:#454b57; }
  .tooltip { position:absolute; background:#12161fee; border:1px solid #232a38; border-radius:8px; padding:9px 11px; font-size:11.5px; min-width:150px; pointer-events:none; backdrop-filter: blur(4px); z-index:5; }
  .tooltipDate { font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:#7b8291; margin-bottom:5px; font-weight:600; }
  .tooltipRow { display:flex; align-items:center; gap:6px; padding:2px 0; }
  .tooltipSym { font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:11.5px; min-width:38px; }
  .tooltipPrice { color:#7b8291; font-family:'IBM Plex Mono', monospace; font-size:11px; flex:1; text-align:right; }
  .tooltipPct { font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:11px; min-width:52px; text-align:right; }
  input:focus { outline:none; }
  button { font-family:inherit; cursor:pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="titleRow">
    <div class="logoDot"></div>
    <h1>Compare</h1>
    <span class="subtitle">live multi-symbol performance</span>
  </div>
  <div class="headerBtns">
    <button class="iconBtn" id="refreshBtn" title="Refresh prices">⟳</button>
    <button class="iconBtn" id="keyToggleBtn">🔑</button>
  </div>
</div>

<div class="keyPanel" id="keyPanel" style="display:none">
  <div class="keyPanelRow">
    <input class="keyInput mono" id="keyInput" type="password" placeholder="Twelve Data API key" />
    <button class="keySaveBtn" id="keySaveBtn">Connect</button>
  </div>
  <div class="keyNote">Free key at <span class="keyLink">twelvedata.com</span> · saved only on this device (localStorage), never sent anywhere else.</div>
</div>

<div class="noKeyBanner" id="noKeyBanner" style="display:none">⚠️ Add an API key to load live prices</div>

<div class="symbolGrid" id="symbolGrid"></div>

<div class="addRow">
  <input class="addInput mono" id="addInput" placeholder="Add symbol e.g. AMZN" maxlength="6" />
  <button class="addBtn" id="addBtn">Add</button>
</div>

<div class="rangeGroup" id="rangeGroup"></div>

<div class="chartCard" id="chartCard">
  <div class="emptyState" id="emptyState">Connect an API key to load real price history.</div>
  <svg id="chartSvg" width="100%" height="300" style="display:none; touch-action:none;"></svg>
  <div class="tooltip" id="tooltip" style="display:none"></div>
</div>

<div class="footerRow"><span class="footerNote">Live data via Twelve Data · tap a symbol card to hide/show on chart</span></div>

<script>
// ---------------- config ----------------
const LINE_COLORS = ["#3d7cf4", "#f2994a", "#a56bf5", "#2fbf9f", "#f25a5a", "#f5c542", "#5ac8fa", "#e05fa0"];
const RANGE_OPTIONS = [
  { key: "1D", interval: "15min", outputsize: 27 },
  { key: "5D", interval: "1day", outputsize: 5 },
  { key: "1M", interval: "1day", outputsize: 22 },
  { key: "3M", interval: "1day", outputsize: 65 },
  { key: "1Y", interval: "1day", outputsize: 252 },
];
const DEFAULT_TICKERS = ["AAPL", "MSFT", "NVDA"];
const QUOTE_REFRESH_MS = 60000; // auto-refresh current price every 60s

// ---------------- state ----------------
let tickers = JSON.parse(localStorage.getItem("cmp_tickers") || "null") || [...DEFAULT_TICKERS];
let range = localStorage.getItem("cmp_range") || "1M";
let apiKey = localStorage.getItem("cmp_apikey") || "";
let hidden = new Set();
let seriesByTicker = {};
let quoteByTicker = {};       // current real price + day change per ticker
let loadingSet = new Set();   // history loading
let quoteLoadingSet = new Set();
let errorsByTicker = {};
let cache = {};

function persist() {
  localStorage.setItem("cmp_tickers", JSON.stringify(tickers));
  localStorage.setItem("cmp_range", range);
  localStorage.setItem("cmp_apikey", apiKey);
}

function colorOf(t) { return LINE_COLORS[tickers.indexOf(t) % LINE_COLORS.length]; }
function fmtPct(v) { return (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }
function fmtPrice(v) { return "$" + v.toFixed(2); }
function fmtChangeAbs(v) { return (v >= 0 ? "+" : "") + v.toFixed(2); }

function fmtDateLabel(dtStr, interval) {
  const d = new Date(dtStr.replace(" ", "T"));
  if (interval === "15min") return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

// ---------------- API calls ----------------
async function fetchTwelveData(ticker, rangeOpt) {
  const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(ticker)}&interval=${rangeOpt.interval}&outputsize=${rangeOpt.outputsize}&apikey=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.status === "error" || !json.values) throw new Error(json.message || `No data for ${ticker}`);
  const values = [...json.values].reverse();
  return values.map((v) => ({ dateLabel: fmtDateLabel(v.datetime, rangeOpt.interval), price: parseFloat(v.close) }));
}

// current real-time (delayed on free plan) price + official day change
async function fetchQuote(ticker) {
  const url = `https://api.twelvedata.com/quote?symbol=${encodeURIComponent(ticker)}&apikey=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url);
  const json = await res.json();
  if (json.status === "error" || json.code) throw new Error(json.message || `No quote for ${ticker}`);
  return {
    price: parseFloat(json.close),
    change: parseFloat(json.change),
    percentChange: parseFloat(json.percent_change),
    isMarketOpen: json.is_market_open,
  };
}

async function loadTicker(t) {
  if (!apiKey) return;
  const rangeOpt = RANGE_OPTIONS.find((r) => r.key === range);
  const cacheKey = t + "|" + range;
  if (cache[cacheKey]) { seriesByTicker[t] = cache[cacheKey]; render(); return; }
  loadingSet.add(t); delete errorsByTicker[t]; render();
  try {
    const data = await fetchTwelveData(t, rangeOpt);
    cache[cacheKey] = data;
    seriesByTicker[t] = data;
  } catch (err) {
    errorsByTicker[t] = err.message || "Failed to load";
  } finally {
    loadingSet.delete(t); render();
  }
}

async function loadQuote(t) {
  if (!apiKey) return;
  quoteLoadingSet.add(t); render();
  try {
    const q = await fetchQuote(t);
    quoteByTicker[t] = q;
    delete errorsByTicker[t];
  } catch (err) {
    if (!seriesByTicker[t]) errorsByTicker[t] = err.message || "Failed to load";
  } finally {
    quoteLoadingSet.delete(t); render();
  }
}

let loadToken = 0;
async function loadAll() {
  if (!apiKey) { render(); return; }
  const myToken = ++loadToken;
  for (const t of tickers) {
    if (myToken !== loadToken) return;
    await loadQuote(t);
    await new Promise((r) => setTimeout(r, 300));
    if (myToken !== loadToken) return;
    await loadTicker(t);
    await new Promise((r) => setTimeout(r, 300));
  }
}

async function refreshQuotesOnly() {
  if (!apiKey) return;
  for (const t of tickers) {
    await loadQuote(t);
    await new Promise((r) => setTimeout(r, 300));
  }
}
setInterval(refreshQuotesOnly, QUOTE_REFRESH_MS);

function addTicker(raw) {
  const t = raw.trim().toUpperCase().replace(/[^A-Z.]/g, "");
  if (!t || tickers.includes(t) || tickers.length >= 8) return;
  tickers.push(t);
  persist(); render(); loadAll();
}
function removeTicker(t) {
  tickers = tickers.filter((x) => x !== t);
  hidden.delete(t);
  persist(); render();
}
function toggleHidden(t) {
  if (hidden.has(t)) hidden.delete(t); else hidden.add(t);
  render();
}

// ---------------- rendering: chrome ----------------
const rangeGroupEl = document.getElementById("rangeGroup");
RANGE_OPTIONS.forEach((r) => {
  const btn = document.createElement("button");
  btn.className = "rangeBtn" + (r.key === range ? " active" : "");
  btn.textContent = r.key;
  btn.onclick = () => { range = r.key; persist(); renderRangeButtons(); render(); loadAll(); };
  btn.dataset.key = r.key;
  rangeGroupEl.appendChild(btn);
});
function renderRangeButtons() {
  [...rangeGroupEl.children].forEach((b) => b.classList.toggle("active", b.dataset.key === range));
}

document.getElementById("keyToggleBtn").onclick = () => {
  const p = document.getElementById("keyPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
};
document.getElementById("keySaveBtn").onclick = () => {
  const v = document.getElementById("keyInput").value.trim();
  if (!v) return;
  apiKey = v; cache = {}; persist();
  document.getElementById("keyPanel").style.display = "none";
  render(); loadAll();
};
document.getElementById("keyInput").value = apiKey;
document.getElementById("refreshBtn").onclick = () => { cache = {}; loadAll(); };

document.getElementById("addBtn").onclick = () => {
  const inp = document.getElementById("addInput");
  addTicker(inp.value); inp.value = "";
};
document.getElementById("addInput").onkeydown = (e) => {
  if (e.key === "Enter") { addTicker(e.target.value); e.target.value = ""; }
};

function renderSymbolGrid() {
  const grid = document.getElementById("symbolGrid");
  grid.innerHTML = "";
  tickers.forEach((t) => {
    const card = document.createElement("div");
    card.className = "symbolCard" + (hidden.has(t) ? " dimmed" : "");
    card.style.borderLeftColor = colorOf(t);
    card.style.background = `linear-gradient(90deg, ${colorOf(t)}14, #12161f 40%)`;

    const err = errorsByTicker[t];
    const q = quoteByTicker[t];
    const isQuoteLoading = quoteLoadingSet.has(t);
    const isHistLoading = loadingSet.has(t);

    const top = document.createElement("div");
    top.className = "symbolCardTop";
    const sym = document.createElement("span");
    sym.className = "symbolSym";
    sym.textContent = t;
    const rm = document.createElement("span");
    rm.className = "symbolRemove";
    rm.textContent = "✕";
    rm.onclick = (e) => { e.stopPropagation(); removeTicker(t); };
    top.appendChild(sym); top.appendChild(rm);
    card.appendChild(top);

    if (err) {
      const e = document.createElement("div");
      e.className = "symbolErr"; e.textContent = "⚠ " + err;
      card.appendChild(e);
    } else if (isQuoteLoading && !q) {
      const l = document.createElement("div");
      l.className = "symbolLoading";
      l.innerHTML = `<span class="spin">⟳</span> loading…`;
      card.appendChild(l);
    } else if (q) {
      const price = document.createElement("div");
      price.className = "symbolPrice";
      price.textContent = fmtPrice(q.price);
      card.appendChild(price);

      const changeRow = document.createElement("div");
      changeRow.className = "symbolChangeRow";
      const up = q.change >= 0;
      const abs = document.createElement("span");
      abs.className = "symbolChangeAbs";
      abs.textContent = fmtChangeAbs(q.change);
      const pct = document.createElement("span");
      pct.className = "symbolChangePct";
      pct.style.color = up ? "#2fbf9f" : "#f25a5a";
      pct.style.background = up ? "#2fbf9f1c" : "#f25a5a1c";
      pct.textContent = fmtPct(q.percentChange);
      changeRow.appendChild(abs); changeRow.appendChild(pct);
      card.appendChild(changeRow);
    } else {
      const l = document.createElement("div");
      l.className = "symbolLoading"; l.textContent = "—";
      card.appendChild(l);
    }

    card.onclick = () => toggleHidden(t);
    grid.appendChild(card);
  });
}

document.getElementById("noKeyBanner").onclick = () => {
  document.getElementById("keyPanel").style.display = "block";
};

// ---------------- chart (SVG) ----------------
const svg = document.getElementById("chartSvg");
const tooltip = document.getElementById("tooltip");
const emptyState = document.getElementById("emptyState");
const NS = "http://www.w3.org/2000/svg";

function buildRows() {
  const lens = tickers.map((t) => (seriesByTicker[t] || []).length);
  const len = Math.max(0, ...lens);
  const rows = [];
  for (let i = 0; i < len; i++) {
    let dateLabel = "";
    const row = {};
    for (const t of tickers) {
      const s = seriesByTicker[t];
      if (!s || !s[i] || !s[0]) continue;
      if (!dateLabel) dateLabel = s[i].dateLabel;
      const base = s[0].price;
      row[t] = ((s[i].price - base) / base) * 100;
      row[t + "_price"] = s[i].price;
    }
    row.dateLabel = dateLabel;
    rows.push(row);
  }
  return rows;
}

function drawChart() {
  const rows = buildRows();
  const visibleTickers = tickers.filter((t) => !hidden.has(t) && seriesByTicker[t]);
  if (!apiKey) {
    emptyState.style.display = "block"; emptyState.textContent = "Connect an API key to load real price history.";
    svg.style.display = "none"; tooltip.style.display = "none";
    return;
  }
  if (rows.length === 0 || visibleTickers.length === 0) {
    emptyState.style.display = "block"; emptyState.textContent = "Loading price data…";
    svg.style.display = "none"; tooltip.style.display = "none";
    return;
  }
  emptyState.style.display = "none";
  svg.style.display = "block";

  const width = svg.clientWidth || svg.parentElement.clientWidth - 12;
  const height = 300;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = "";

  const padL = 40, padR = 10, padT = 14, padB = 26;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  let vmin = Infinity, vmax = -Infinity;
  rows.forEach((row) => visibleTickers.forEach((t) => {
    if (row[t] != null) { vmin = Math.min(vmin, row[t]); vmax = Math.max(vmax, row[t]); }
  }));
  if (vmin === vmax) { vmin -= 1; vmax += 1; }
  const pad = (vmax - vmin) * 0.1;
  vmin -= pad; vmax += pad;

  const xFor = (i) => padL + (rows.length <= 1 ? 0 : (i / (rows.length - 1)) * plotW);
  const yFor = (v) => padT + plotH - ((v - vmin) / (vmax - vmin)) * plotH;

  const gridSteps = 4;
  for (let g = 0; g <= gridSteps; g++) {
    const v = vmin + (g / gridSteps) * (vmax - vmin);
    const y = yFor(v);
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", padL); line.setAttribute("x2", width - padR);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("stroke", v >= -0.001 && v <= 0.001 ? "#2a303c" : "#1b2028");
    line.setAttribute("stroke-width", "1");
    svg.appendChild(line);

    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", 4); label.setAttribute("y", y + 3);
    label.setAttribute("fill", "#5b6270"); label.setAttribute("font-size", "10");
    label.setAttribute("font-family", "IBM Plex Mono, monospace");
    label.textContent = (v > 0 ? "+" : "") + v.toFixed(1) + "%";
    svg.appendChild(label);
  }

  const xTickEvery = Math.max(1, Math.ceil(rows.length / 5));
  rows.forEach((row, i) => {
    if (i % xTickEvery !== 0 && i !== rows.length - 1) return;
    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", xFor(i)); label.setAttribute("y", height - 8);
    label.setAttribute("fill", "#5b6270"); label.setAttribute("font-size", "10");
    label.setAttribute("font-family", "IBM Plex Mono, monospace");
    label.setAttribute("text-anchor", i === rows.length - 1 ? "end" : "middle");
    label.textContent = row.dateLabel;
    svg.appendChild(label);
  });

  visibleTickers.forEach((t) => {
    let d = "";
    rows.forEach((row, i) => {
      if (row[t] == null) return;
      const x = xFor(i), y = yFor(row[t]);
      d += (d === "" ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
    });
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d.trim());
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", colorOf(t));
    path.setAttribute("stroke-width", "2.25");
    path.setAttribute("stroke-linejoin", "round");
    path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);
  });

  const overlay = document.createElementNS(NS, "rect");
  overlay.setAttribute("x", padL); overlay.setAttribute("y", padT);
  overlay.setAttribute("width", plotW); overlay.setAttribute("height", plotH);
  overlay.setAttribute("fill", "transparent");
  svg.appendChild(overlay);

  const crosshair = document.createElementNS(NS, "line");
  crosshair.setAttribute("y1", padT); crosshair.setAttribute("y2", padT + plotH);
  crosshair.setAttribute("stroke", "#3a4150"); crosshair.setAttribute("stroke-dasharray", "3 3");
  crosshair.setAttribute("visibility", "hidden");
  svg.appendChild(crosshair);

  function handleMove(clientX) {
    const rect = svg.getBoundingClientRect();
    const relX = ((clientX - rect.left) / rect.width) * width;
    let idx = Math.round(((relX - padL) / plotW) * (rows.length - 1));
    idx = Math.max(0, Math.min(rows.length - 1, idx));
    const x = xFor(idx);
    crosshair.setAttribute("x1", x); crosshair.setAttribute("x2", x);
    crosshair.setAttribute("visibility", "visible");
    showTooltip(rows[idx], visibleTickers, x, rect);
  }
  function handleLeave() {
    crosshair.setAttribute("visibility", "hidden");
    tooltip.style.display = "none";
  }
  overlay.addEventListener("mousemove", (e) => handleMove(e.clientX));
  overlay.addEventListener("mouseleave", handleLeave);
  overlay.addEventListener("touchstart", (e) => { handleMove(e.touches[0].clientX); }, { passive: true });
  overlay.addEventListener("touchmove", (e) => { handleMove(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  overlay.addEventListener("touchend", handleLeave);
}

function showTooltip(row, visibleTickers, x, svgRect) {
  let html = `<div class="tooltipDate">${row.dateLabel}</div>`;
  visibleTickers.forEach((t) => {
    if (row[t] == null) return;
    const price = row[t + "_price"];
    const up = row[t] >= 0;
    html += `<div class="tooltipRow">
      <span class="dot" style="width:7px;height:7px;border-radius:50%;background:${colorOf(t)}"></span>
      <span class="tooltipSym">${t}</span>
      <span class="tooltipPrice">${fmtPrice(price)}</span>
      <span class="tooltipPct" style="color:${up ? "#2fbf9f" : "#f25a5a"}">${fmtPct(row[t])}</span>
    </div>`;
  });
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  const cardWidth = svgRect.width;
  let left = x + 12;
  if (left + 170 > cardWidth) left = x - 170 - 12;
  tooltip.style.left = Math.max(4, left) + "px";
  tooltip.style.top = "10px";
}

// ---------------- master render ----------------
function render() {
  renderRangeButtons();
  renderSymbolGrid();
  document.getElementById("noKeyBanner").style.display = (!apiKey && document.getElementById("keyPanel").style.display !== "block") ? "flex" : "none";
  drawChart();
}

window.addEventListener("resize", drawChart);

// ---------------- boot ----------------
render();
loadAll();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
