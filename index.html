<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d13" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Compare" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Compare — Manual Price Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0a0d13; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #d1d4dc;
    padding: env(safe-area-inset-top,16px) 14px calc(env(safe-area-inset-bottom,16px) + 16px);
    max-width: 720px;
    margin: 0 auto;
    -webkit-user-select: none;
    user-select: none;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; padding-top:6px; }
  .titleRow { display:flex; align-items:baseline; gap:7px; }
  .logoDot { width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,#3d7cf4,#2fbf9f); }
  h1 { font-size:18px; font-weight:700; margin:0; letter-spacing:-0.02em; color:#eef0f4; }
  .subtitle { font-size:11px; color:#5b6270; font-weight:500; }

  .rangeGroup { display:flex; gap:2px; background:#12161f; border:1px solid #1c212b; border-radius:9px; padding:3px; margin-bottom:12px; }
  .rangeBtn { flex:1; background:transparent; border:none; color:#7b8291; font-size:12.5px; font-weight:600; padding:8px 0; border-radius:6px; font-family:'IBM Plex Mono', monospace; }
  .rangeBtn.active { background:#232a38; color:#eef0f4; }

  .symbolGrid { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-bottom:10px; }
  .symbolCard {
    position:relative; background:#12161f; border-radius:10px; padding:10px 10px 9px 12px;
    border:1px solid #1c212b; border-left-width:4px; overflow:hidden; transition:opacity .15s;
  }
  .symbolCard.dimmed { opacity:0.38; }
  .symbolCard.editing { border-color:#3d7cf4; }
  .symbolCardTop { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .symbolSym { font-size:14.5px; font-weight:700; font-family:'IBM Plex Mono', monospace; color:#f2f4f7; letter-spacing:0.2px; }
  .symbolIcons { display:flex; align-items:center; gap:8px; }
  .symbolIconBtn { color:#6b7280; font-size:13px; padding:2px; line-height:1; }
  .symbolPrice { font-size:17px; font-weight:700; font-family:'IBM Plex Mono', monospace; color:#eef0f4; line-height:1.1; }
  .symbolPriceEmpty { font-size:12px; color:#454b57; font-style:normal; }
  .symbolChangeRow { display:flex; align-items:center; gap:6px; margin-top:3px; }
  .symbolChangeAbs { font-size:11px; font-family:'IBM Plex Mono', monospace; color:#7b8291; }
  .symbolChangePct { font-size:11.5px; font-weight:700; font-family:'IBM Plex Mono', monospace; padding:1px 6px; border-radius:5px; }
  .symbolAsOf { font-size:10px; color:#454b57; margin-top:4px; font-family:'IBM Plex Mono', monospace; }

  .addRow { display:flex; align-items:center; gap:8px; background:#0d1017; border:1px dashed #262c38; border-radius:10px; padding:9px 10px; margin-bottom:12px; }
  .addInput { flex:1; background:transparent; border:none; color:#eef0f4; font-size:13px; font-family:'IBM Plex Mono', monospace; min-width:0; }
  .addBtn { background:#1a2029; border:none; border-radius:7px; padding:7px 14px; color:#9198a8; font-size:13px; font-weight:600; }

  .editPanel { background:#12161f; border:1px solid #232a38; border-radius:10px; padding:12px; margin-bottom:14px; }
  .editPanelTitle { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .editPanelSym { font-size:13.5px; font-weight:700; font-family:'IBM Plex Mono', monospace; color:#eef0f4; }
  .editPanelClose { color:#6b7280; font-size:14px; padding:2px 6px; }
  .editPanelRow { display:flex; gap:8px; margin-bottom:8px; }
  .editPanelRow input { background:#0d1017; border:1px solid #232a38; border-radius:7px; padding:9px 10px; color:#eef0f4; font-size:13px; font-family:'IBM Plex Mono', monospace; min-width:0; }
  .editPanelRow input[type=date] { flex:1.1; }
  .editPanelRow input[type=number] { flex:1; }
  .editSaveBtn { width:100%; background:#2d5df1; border:none; border-radius:7px; padding:10px; color:#fff; font-size:13px; font-weight:700; margin-bottom:10px; }
  .historyList { display:flex; flex-direction:column; gap:4px; max-height:160px; overflow-y:auto; }
  .historyRow { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; background:#0d1017; border-radius:6px; font-size:12px; }
  .historyDate { color:#7b8291; font-family:'IBM Plex Mono', monospace; }
  .historyPrice { color:#eef0f4; font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .historyDel { color:#f25a5a; font-size:13px; padding:2px 6px; margin-left:8px; }
  .historyEmpty { color:#454b57; font-size:12px; text-align:center; padding:10px; }

  .importSection { border-top:1px solid #1c212b; margin-top:10px; padding-top:10px; }
  .importLabel { font-size:11px; color:#6b7280; margin-bottom:6px; }
  .importRow { display:flex; gap:6px; margin-bottom:8px; }
  .importRow input[type=password] { flex:1; background:#0d1017; border:1px solid #232a38; border-radius:7px; padding:9px 10px; color:#eef0f4; font-size:12.5px; font-family:'IBM Plex Mono', monospace; min-width:0; }
  .importRow select { background:#0d1017; border:1px solid #232a38; border-radius:7px; padding:9px 8px; color:#eef0f4; font-size:12.5px; font-family:'IBM Plex Mono', monospace; }
  .importBtn { flex:1; background:#1a2029; border:1px solid #2a3140; border-radius:7px; padding:9px; color:#c7d0e0; font-size:12.5px; font-weight:600; }
  .importStatus { font-size:11px; color:#7b8291; min-height:14px; }
  .importNote { font-size:10px; color:#454b57; margin-top:6px; line-height:1.4; }

  .chartCard { background:#0d1017; border:1px solid #171b24; border-radius:12px; padding:14px 6px 6px; min-height:280px; position:relative; }
  .emptyState { color:#454b57; font-size:13px; text-align:center; padding:50px 20px; line-height:1.6; }
  .footerRow { margin-top:10px; text-align:center; }
  .footerNote { font-size:10.5px; color:#454b57; }
  .tooltip { position:absolute; background:#12161fee; border:1px solid #232a38; border-radius:8px; padding:9px 11px; font-size:11.5px; min-width:150px; pointer-events:none; backdrop-filter: blur(4px); z-index:5; }
  .tooltipDate { font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:#7b8291; margin-bottom:5px; font-weight:600; }
  .tooltipRow { display:flex; align-items:center; gap:6px; padding:2px 0; }
  .tooltipSym { font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:11.5px; min-width:38px; }
  .tooltipPrice { color:#7b8291; font-family:'IBM Plex Mono', monospace; font-size:11px; flex:1; text-align:right; }
  .tooltipPct { font-weight:700; font-family:'IBM Plex Mono', monospace; font-size:11px; min-width:52px; text-align:right; }
  input:focus { outline:none; border-color:#3d7cf4 !important; }
  button { font-family:inherit; cursor:pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="titleRow">
    <div class="logoDot"></div>
    <h1>Compare</h1>
    <span class="subtitle">manual price log</span>
  </div>
</div>

<div class="rangeGroup" id="rangeGroup"></div>

<div class="symbolGrid" id="symbolGrid"></div>

<div class="addRow">
  <input class="addInput mono" id="addInput" placeholder="Add symbol e.g. AAPL" maxlength="10" />
  <button class="addBtn" id="addBtn">Add</button>
</div>

<div id="editPanelWrap"></div>

<div class="chartCard" id="chartCard">
  <div class="emptyState" id="emptyState">ยังไม่มีข้อมูล — กดไอคอน ✎ ที่การ์ดหุ้นเพื่อเริ่มบันทึกราคา</div>
  <svg id="chartSvg" width="100%" height="280" style="display:none; touch-action:none;"></svg>
  <div class="tooltip" id="tooltip" style="display:none"></div>
</div>

<div class="footerRow"><span class="footerNote">ข้อมูลที่คุณบันทึกเอง เก็บไว้ในเครื่องนี้เท่านั้น · แตะการ์ดเพื่อซ่อน/แสดงเส้นในกราฟ</span></div>

<script>
// ---------------- config ----------------
const LINE_COLORS = ["#3d7cf4", "#f2994a", "#a56bf5", "#2fbf9f", "#f25a5a", "#f5c542", "#5ac8fa", "#e05fa0"];
const RANGE_OPTIONS = [
  { key: "1W", days: 7 },
  { key: "1M", days: 30 },
  { key: "3M", days: 90 },
  { key: "1Y", days: 365 },
  { key: "All", days: Infinity },
];
const DEFAULT_TICKERS = ["AAPL", "MSFT", "NVDA"];

// ---------------- state ----------------
let tickers = JSON.parse(localStorage.getItem("cmp_tickers") || "null") || [...DEFAULT_TICKERS];
let range = localStorage.getItem("cmp_range") || "1M";
let hidden = new Set();
let history = JSON.parse(localStorage.getItem("cmp_history") || "{}"); // { AAPL: [{date:"2026-08-01",price:231.4}, ...] sorted asc }
let editingTicker = null;
let importApiKey = localStorage.getItem("cmp_apikey") || "";
let importStatusByTicker = {};

tickers.forEach((t) => { if (!history[t]) history[t] = []; });

function persist() {
  localStorage.setItem("cmp_tickers", JSON.stringify(tickers));
  localStorage.setItem("cmp_range", range);
  localStorage.setItem("cmp_history", JSON.stringify(history));
}

function colorOf(t) { return LINE_COLORS[tickers.indexOf(t) % LINE_COLORS.length]; }
function fmtPct(v) { return (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }
function fmtPrice(v) { return "$" + v.toFixed(2); }
function fmtChangeAbs(v) { return (v >= 0 ? "+" : "") + v.toFixed(2); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDateShort(dStr) {
  const d = new Date(dStr + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function upsertEntry(t, dateStr, price) {
  const arr = history[t] || (history[t] = []);
  const idx = arr.findIndex((e) => e.date === dateStr);
  if (idx >= 0) arr[idx].price = price;
  else arr.push({ date: dateStr, price });
  arr.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  persist();
}
function deleteEntry(t, dateStr) {
  history[t] = (history[t] || []).filter((e) => e.date !== dateStr);
  persist();
}

// one-off historical backfill via Twelve Data — a single API call, not repeated automatically
async function importHistory(t, days) {
  const keyInput = document.getElementById("apiKeyInput");
  const key = (keyInput ? keyInput.value : importApiKey).trim();
  if (!key) { importStatusByTicker[t] = { text: "กรุณาใส่ API key ก่อน", err: true }; render(); return; }
  importApiKey = key;
  localStorage.setItem("cmp_apikey", key);
  importStatusByTicker[t] = { text: "กำลังโหลด…", err: false };
  render();
  try {
    const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(t)}&interval=1day&outputsize=${days}&apikey=${encodeURIComponent(key)}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.status === "error" || !json.values) throw new Error(json.message || "โหลดไม่สำเร็จ");
    json.values.forEach((v) => {
      upsertEntry(t, v.datetime.slice(0, 10), parseFloat(v.close));
    });
    importStatusByTicker[t] = { text: `นำเข้าแล้ว ${json.values.length} วัน ✓`, err: false };
  } catch (err) {
    importStatusByTicker[t] = { text: "⚠ " + (err.message || "เกิดข้อผิดพลาด"), err: true };
  } finally {
    render();
  }
}

function addTicker(raw) {
  const t = raw.trim().toUpperCase().replace(/[^A-Z0-9.]/g, "").slice(0, 10);
  if (!t || tickers.includes(t) || tickers.length >= 8) return;
  tickers.push(t);
  history[t] = [];
  persist(); render();
}
function removeTicker(t) {
  tickers = tickers.filter((x) => x !== t);
  hidden.delete(t);
  delete history[t];
  if (editingTicker === t) editingTicker = null;
  persist(); render();
}
function toggleHidden(t) {
  if (hidden.has(t)) hidden.delete(t); else hidden.add(t);
  render();
}

// ---------------- range buttons ----------------
const rangeGroupEl = document.getElementById("rangeGroup");
RANGE_OPTIONS.forEach((r) => {
  const btn = document.createElement("button");
  btn.className = "rangeBtn" + (r.key === range ? " active" : "");
  btn.textContent = r.key;
  btn.dataset.key = r.key;
  btn.onclick = () => { range = r.key; persist(); render(); };
  rangeGroupEl.appendChild(btn);
});
function renderRangeButtons() {
  [...rangeGroupEl.children].forEach((b) => b.classList.toggle("active", b.dataset.key === range));
}

// ---------------- add ----------------
document.getElementById("addBtn").onclick = () => {
  const inp = document.getElementById("addInput");
  addTicker(inp.value); inp.value = "";
};
document.getElementById("addInput").onkeydown = (e) => {
  if (e.key === "Enter") { addTicker(e.target.value); e.target.value = ""; }
};

// ---------------- symbol grid ----------------
function lastTwo(t) {
  const arr = history[t] || [];
  return { latest: arr[arr.length - 1] || null, prev: arr[arr.length - 2] || null };
}

function renderSymbolGrid() {
  const grid = document.getElementById("symbolGrid");
  grid.innerHTML = "";
  tickers.forEach((t) => {
    const card = document.createElement("div");
    card.className = "symbolCard" + (hidden.has(t) ? " dimmed" : "") + (editingTicker === t ? " editing" : "");
    card.style.borderLeftColor = colorOf(t);
    card.style.background = `linear-gradient(90deg, ${colorOf(t)}14, #12161f 40%)`;

    const top = document.createElement("div");
    top.className = "symbolCardTop";
    const sym = document.createElement("span");
    sym.className = "symbolSym";
    sym.textContent = t;
    const icons = document.createElement("span");
    icons.className = "symbolIcons";
    const edit = document.createElement("span");
    edit.className = "symbolIconBtn"; edit.textContent = "✎";
    edit.onclick = (e) => { e.stopPropagation(); editingTicker = editingTicker === t ? null : t; render(); };
    const rm = document.createElement("span");
    rm.className = "symbolIconBtn"; rm.textContent = "✕";
    rm.onclick = (e) => { e.stopPropagation(); removeTicker(t); };
    icons.appendChild(edit); icons.appendChild(rm);
    top.appendChild(sym); top.appendChild(icons);
    card.appendChild(top);

    const { latest, prev } = lastTwo(t);
    if (!latest) {
      const p = document.createElement("div");
      p.className = "symbolPriceEmpty"; p.textContent = "ยังไม่มีข้อมูล";
      card.appendChild(p);
    } else {
      const price = document.createElement("div");
      price.className = "symbolPrice"; price.textContent = fmtPrice(latest.price);
      card.appendChild(price);

      if (prev) {
        const changeAbs = latest.price - prev.price;
        const changePct = (changeAbs / prev.price) * 100;
        const up = changeAbs >= 0;
        const row = document.createElement("div");
        row.className = "symbolChangeRow";
        const abs = document.createElement("span");
        abs.className = "symbolChangeAbs"; abs.textContent = fmtChangeAbs(changeAbs);
        const pct = document.createElement("span");
        pct.className = "symbolChangePct";
        pct.style.color = up ? "#2fbf9f" : "#f25a5a";
        pct.style.background = up ? "#2fbf9f1c" : "#f25a5a1c";
        pct.textContent = fmtPct(changePct);
        row.appendChild(abs); row.appendChild(pct);
        card.appendChild(row);
      }
      const asOf = document.createElement("div");
      asOf.className = "symbolAsOf"; asOf.textContent = "as of " + fmtDateShort(latest.date);
      card.appendChild(asOf);
    }

    card.onclick = () => toggleHidden(t);
    grid.appendChild(card);
  });
}

// ---------------- edit panel ----------------
function renderEditPanel() {
  const wrap = document.getElementById("editPanelWrap");
  wrap.innerHTML = "";
  if (!editingTicker || !tickers.includes(editingTicker)) return;
  const t = editingTicker;

  const panel = document.createElement("div");
  panel.className = "editPanel";

  const titleRow = document.createElement("div");
  titleRow.className = "editPanelTitle";
  const title = document.createElement("span");
  title.className = "editPanelSym mono"; title.textContent = "บันทึกราคา · " + t;
  const close = document.createElement("span");
  close.className = "editPanelClose"; close.textContent = "✕";
  close.onclick = () => { editingTicker = null; render(); };
  titleRow.appendChild(title); titleRow.appendChild(close);
  panel.appendChild(titleRow);

  const row = document.createElement("div");
  row.className = "editPanelRow";
  const dateInput = document.createElement("input");
  dateInput.type = "date"; dateInput.value = todayStr(); dateInput.max = todayStr();
  const priceInput = document.createElement("input");
  priceInput.type = "number"; priceInput.inputMode = "decimal"; priceInput.step = "0.01";
  priceInput.placeholder = "ราคา เช่น 231.40";
  row.appendChild(dateInput); row.appendChild(priceInput);
  panel.appendChild(row);

  const saveBtn = document.createElement("button");
  saveBtn.className = "editSaveBtn"; saveBtn.textContent = "บันทึก";
  saveBtn.onclick = () => {
    const p = parseFloat(priceInput.value);
    if (!dateInput.value || isNaN(p)) return;
    upsertEntry(t, dateInput.value, p);
    priceInput.value = "";
    render();
  };
  panel.appendChild(saveBtn);

  const listWrap = document.createElement("div");
  listWrap.className = "historyList";
  const entries = [...(history[t] || [])].reverse();
  if (entries.length === 0) {
    const e = document.createElement("div");
    e.className = "historyEmpty"; e.textContent = "ยังไม่มีประวัติราคา";
    listWrap.appendChild(e);
  } else {
    entries.forEach((entry) => {
      const r = document.createElement("div");
      r.className = "historyRow";
      const d = document.createElement("span");
      d.className = "historyDate mono"; d.textContent = entry.date;
      const p = document.createElement("span");
      p.className = "historyPrice"; p.textContent = fmtPrice(entry.price);
      const del = document.createElement("span");
      del.className = "historyDel"; del.textContent = "✕";
      del.onclick = () => { deleteEntry(t, entry.date); render(); };
      const right = document.createElement("span");
      right.style.display = "flex"; right.style.alignItems = "center";
      right.appendChild(p); right.appendChild(del);
      r.appendChild(d); r.appendChild(right);
      listWrap.appendChild(r);
    });
  }
  panel.appendChild(listWrap);

  const importSection = document.createElement("div");
  importSection.className = "importSection";
  const importLabel = document.createElement("div");
  importLabel.className = "importLabel"; importLabel.textContent = "นำเข้าราคาย้อนหลัง (ครั้งเดียว ไม่ดึงซ้ำอัตโนมัติ)";
  importSection.appendChild(importLabel);

  const keyRow = document.createElement("div");
  keyRow.className = "importRow";
  const keyInput = document.createElement("input");
  keyInput.type = "password"; keyInput.id = "apiKeyInput";
  keyInput.placeholder = "Twelve Data API key"; keyInput.value = importApiKey;
  keyRow.appendChild(keyInput);
  importSection.appendChild(keyRow);

  const actionRow = document.createElement("div");
  actionRow.className = "importRow";
  const daysSelect = document.createElement("select");
  [["30","30 วัน"],["90","90 วัน"],["365","1 ปี"]].forEach(([v,l]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = l;
    daysSelect.appendChild(o);
  });
  const importBtn = document.createElement("button");
  importBtn.className = "importBtn"; importBtn.textContent = "นำเข้า";
  importBtn.onclick = () => importHistory(t, parseInt(daysSelect.value, 10));
  actionRow.appendChild(daysSelect); actionRow.appendChild(importBtn);
  importSection.appendChild(actionRow);

  const status = document.createElement("div");
  status.className = "importStatus";
  const st = importStatusByTicker[t];
  if (st) { status.textContent = st.text; status.style.color = st.err ? "#f25a5a" : "#2fbf9f"; }
  importSection.appendChild(status);

  const note = document.createElement("div");
  note.className = "importNote";
  note.textContent = "ฟรีจาก twelvedata.com · ถ้านำเข้าหลายตัวติดกัน เว้นห่างกันสัก 10 วินาที กัน limit ต่อนาทีของแผนฟรี";
  importSection.appendChild(note);

  panel.appendChild(importSection);
  wrap.appendChild(panel);
}

// ---------------- chart (SVG, date-based x scale) ----------------
const svg = document.getElementById("chartSvg");
const tooltip = document.getElementById("tooltip");
const emptyState = document.getElementById("emptyState");
const NS = "http://www.w3.org/2000/svg";

function filteredSeries(t) {
  const opt = RANGE_OPTIONS.find((r) => r.key === range);
  const arr = history[t] || [];
  if (opt.days === Infinity) return arr;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - opt.days);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  return arr.filter((e) => e.date >= cutoffStr);
}

function drawChart() {
  const visibleTickers = tickers.filter((t) => !hidden.has(t));
  const seriesMap = {};
  let minTs = Infinity, maxTs = -Infinity, anyPoints = false;
  visibleTickers.forEach((t) => {
    const s = filteredSeries(t);
    seriesMap[t] = s;
    s.forEach((e) => {
      const ts = new Date(e.date).getTime();
      minTs = Math.min(minTs, ts); maxTs = Math.max(maxTs, ts);
      anyPoints = true;
    });
  });

  if (!anyPoints) {
    emptyState.style.display = "block";
    emptyState.textContent = "ยังไม่มีข้อมูลในช่วงเวลานี้ — กดไอคอน ✎ ที่การ์ดหุ้นเพื่อเริ่มบันทึกราคา";
    svg.style.display = "none"; tooltip.style.display = "none";
    return;
  }
  emptyState.style.display = "none";
  svg.style.display = "block";
  if (minTs === maxTs) { minTs -= 86400000; maxTs += 86400000; }

  const width = svg.clientWidth || svg.parentElement.clientWidth - 12;
  const height = 280;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = "";

  const padL = 44, padR = 10, padT = 14, padB = 26;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  let vmin = Infinity, vmax = -Infinity;
  visibleTickers.forEach((t) => {
    const s = seriesMap[t];
    if (s.length === 0) return;
    const base = s[0].price;
    s.forEach((e) => {
      const pct = ((e.price - base) / base) * 100;
      vmin = Math.min(vmin, pct); vmax = Math.max(vmax, pct);
    });
  });
  if (vmin === Infinity) { vmin = -1; vmax = 1; }
  if (vmin === vmax) { vmin -= 1; vmax += 1; }
  const padv = (vmax - vmin) * 0.12;
  vmin -= padv; vmax += padv;

  const xFor = (ts) => padL + ((ts - minTs) / (maxTs - minTs)) * plotW;
  const yFor = (v) => padT + plotH - ((v - vmin) / (vmax - vmin)) * plotH;

  const gridSteps = 4;
  for (let g = 0; g <= gridSteps; g++) {
    const v = vmin + (g / gridSteps) * (vmax - vmin);
    const y = yFor(v);
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", padL); line.setAttribute("x2", width - padR);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("stroke", v >= -0.001 && v <= 0.001 ? "#2a303c" : "#1b2028");
    line.setAttribute("stroke-width", "1");
    svg.appendChild(line);
    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", 4); label.setAttribute("y", y + 3);
    label.setAttribute("fill", "#5b6270"); label.setAttribute("font-size", "10");
    label.setAttribute("font-family", "IBM Plex Mono, monospace");
    label.textContent = (v > 0 ? "+" : "") + v.toFixed(1) + "%";
    svg.appendChild(label);
  }

  const xTicks = 4;
  for (let i = 0; i <= xTicks; i++) {
    const ts = minTs + (i / xTicks) * (maxTs - minTs);
    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", xFor(ts)); label.setAttribute("y", height - 8);
    label.setAttribute("fill", "#5b6270"); label.setAttribute("font-size", "10");
    label.setAttribute("font-family", "IBM Plex Mono, monospace");
    label.setAttribute("text-anchor", i === 0 ? "start" : i === xTicks ? "end" : "middle");
    label.textContent = fmtDateShort(new Date(ts).toISOString().slice(0, 10));
    svg.appendChild(label);
  }

  visibleTickers.forEach((t) => {
    const s = seriesMap[t];
    if (s.length === 0) return;
    const base = s[0].price;
    let d = "";
    s.forEach((e) => {
      const ts = new Date(e.date).getTime();
      const pct = ((e.price - base) / base) * 100;
      const x = xFor(ts), y = yFor(pct);
      d += (d === "" ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
    });
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d.trim());
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", colorOf(t));
    path.setAttribute("stroke-width", "2.25");
    path.setAttribute("stroke-linejoin", "round");
    path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);
    s.forEach((e) => {
      const ts = new Date(e.date).getTime();
      const pct = ((e.price - base) / base) * 100;
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", xFor(ts)); c.setAttribute("cy", yFor(pct));
      c.setAttribute("r", s.length === 1 ? "3.5" : "2.5");
      c.setAttribute("fill", colorOf(t));
      svg.appendChild(c);
    });
  });

  const overlay = document.createElementNS(NS, "rect");
  overlay.setAttribute("x", padL); overlay.setAttribute("y", padT);
  overlay.setAttribute("width", plotW); overlay.setAttribute("height", plotH);
  overlay.setAttribute("fill", "transparent");
  svg.appendChild(overlay);

  const crosshair = document.createElementNS(NS, "line");
  crosshair.setAttribute("y1", padT); crosshair.setAttribute("y2", padT + plotH);
  crosshair.setAttribute("stroke", "#3a4150"); crosshair.setAttribute("stroke-dasharray", "3 3");
  crosshair.setAttribute("visibility", "hidden");
  svg.appendChild(crosshair);

  function nearestEntry(t, ts) {
    const s = seriesMap[t];
    if (!s || s.length === 0) return null;
    let best = s[0], bestDiff = Math.abs(new Date(s[0].date).getTime() - ts);
    for (const e of s) {
      const diff = Math.abs(new Date(e.date).getTime() - ts);
      if (diff < bestDiff) { best = e; bestDiff = diff; }
    }
    return best;
  }

  function handleMove(clientX) {
    const rect = svg.getBoundingClientRect();
    const relX = ((clientX - rect.left) / rect.width) * width;
    const ratio = Math.max(0, Math.min(1, (relX - padL) / plotW));
    const ts = minTs + ratio * (maxTs - minTs);
    const x = padL + ratio * plotW;
    crosshair.setAttribute("x1", x); crosshair.setAttribute("x2", x);
    crosshair.setAttribute("visibility", "visible");
    showTooltip(ts, visibleTickers, seriesMap, x, rect, nearestEntry);
  }
  function handleLeave() {
    crosshair.setAttribute("visibility", "hidden");
    tooltip.style.display = "none";
  }
  overlay.addEventListener("mousemove", (e) => handleMove(e.clientX));
  overlay.addEventListener("mouseleave", handleLeave);
  overlay.addEventListener("touchstart", (e) => { handleMove(e.touches[0].clientX); }, { passive: true });
  overlay.addEventListener("touchmove", (e) => { handleMove(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  overlay.addEventListener("touchend", handleLeave);
}

function showTooltip(ts, visibleTickers, seriesMap, x, svgRect, nearestEntry) {
  let html = "";
  let any = false;
  visibleTickers.forEach((t) => {
    const s = seriesMap[t];
    if (!s || s.length === 0) return;
    const entry = nearestEntry(t, ts);
    if (!entry) return;
    any = true;
    const base = s[0].price;
    const pct = ((entry.price - base) / base) * 100;
    const up = pct >= 0;
    html += `<div class="tooltipRow">
      <span style="width:7px;height:7px;border-radius:50%;background:${colorOf(t)};flex-shrink:0;"></span>
      <span class="tooltipSym">${t}</span>
      <span class="tooltipPrice">${fmtPrice(entry.price)}</span>
      <span class="tooltipPct" style="color:${up ? "#2fbf9f" : "#f25a5a"}">${fmtPct(pct)}</span>
    </div>`;
  });
  if (!any) { tooltip.style.display = "none"; return; }
  tooltip.innerHTML = `<div class="tooltipDate">${fmtDateShort(new Date(ts).toISOString().slice(0,10))}</div>` + html;
  tooltip.style.display = "block";
  const cardWidth = svgRect.width;
  let left = x + 12;
  if (left + 170 > cardWidth) left = x - 170 - 12;
  tooltip.style.left = Math.max(4, left) + "px";
  tooltip.style.top = "10px";
}

// ---------------- master render ----------------
function render() {
  renderRangeButtons();
  renderSymbolGrid();
  renderEditPanel();
  drawChart();
}

window.addEventListener("resize", drawChart);

// ---------------- boot ----------------
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
